<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Basketball Club - Contact</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Campus Basketball Club 🏀</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="activities.html">Activities</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Contact Us</h2>
        <p><strong>Meeting Times:</strong> Every Tuesday and Thursday from 5:00 PM to 7:00 PM</p>
        <p><strong>Location:</strong> University Indoor Sports Complex</p>
        <p><strong>Email:</strong> basketball.club@adtu.ac.ae</p>

        <form>
            <h3>Send Us a Message</h3>
            <label for="name">Your Name:</label><br>
            <input type="text" id="name" name="name"><br><br>

            <label for="email">Your Email:</label><br>
            <input type="email" id="email" name="email"><br><br>

            <label for="message">Message:</label><br>
            <textarea id="message" name="message" rows="4" cols="30"></textarea><br><br>

            <button type="submit">Submit</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Campus Basketball Club. All rights reserved.</p>
    </footer>
</body>
</html>
